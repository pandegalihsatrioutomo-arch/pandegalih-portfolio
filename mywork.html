<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Work | Pande Galih</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ["Playfair Display", "serif"],
          },
        },
      },
    };
  </script>
</head>

<body
  class="min-h-screen bg-cover bg-center bg-no-repeat font-serif text-neutral-900"
  style="background-image: url('asset/BG.png');"
>

  <!-- NAVBAR -->
  <nav
    class="absolute top-6 left-1/2 -translate-x-1/2 z-30
           flex gap-12 text-xs tracking-widest font-semibold"
  >
    <a href="index.html" class="hover:opacity-60">HOME</a>
    <a href="about.html" class="hover:opacity-60">ABOUT</a>
    <a href="mywork.html" class="opacity-100">MYWORK</a>
    <a href="contact.html" class="hover:opacity-60">CONTACT</a>
  </nav>

  <!-- MYWORK -->
  <section class="pt-36 pb-28 px-6 sm:px-12">
    <div
      class="bg-white/85 max-w-6xl mx-auto
             px-10 sm:px-20 py-20"
    >

      <!-- HEADER -->
      <header class="max-w-xl mb-28">
        <p class="text-xs tracking-widest mb-4">
          SELECTED WORKS
        </p>
        <h1 class="text-3xl sm:text-5xl leading-tight">
          My Work
        </h1>
        <p class="mt-6 text-sm sm:text-base leading-relaxed">
          A selection of UI/UX and visual projects
          crafted with a focus on clarity,
          usability, and visual storytelling.
        </p>
      </header>

      <!-- GALLERY -->
      <div class="grid grid-cols-12 gap-y-28 gap-x-8">

        <!-- ITEM -->
        <figure class="col-span-12 sm:col-span-7">
          <div class="overflow-hidden">
            <img
              src="asset/project/project1.png"
              alt="Project One"
              class="w-full transition duration-500 ease-out
                     hover:scale-105"
            />
          </div>
          <figcaption class="mt-6 text-sm tracking-wide">
            Project One — UI / UX Design
          </figcaption>
        </figure>

        <!-- ITEM -->
        <figure class="col-span-12 sm:col-span-4 sm:col-start-9 sm:mt-36">
          <div class="overflow-hidden">
            <img
              src="asset/project/project2.png"
              alt="Project Two"
              class="w-full transition duration-500 ease-out
                     hover:scale-105"
            />
          </div>
          <figcaption class="mt-6 text-sm tracking-wide">
            Project Two — Mobile Application
          </figcaption>
        </figure>

        <!-- ITEM -->
        <figure class="col-span-12 sm:col-span-6 sm:col-start-4 sm:-mt-24">
          <div class="overflow-hidden">
            <img
              src="asset/project/project3.png"
              alt="Project Three"
              class="w-full transition duration-500 ease-out
                     hover:scale-105"
            />
          </div>
          <figcaption class="mt-6 text-sm tracking-wide">
            Project Three — Visual Exploration
          </figcaption>
        </figure>

      </div>

      <!-- CTA -->
      <div class="mt-32 flex justify-center">
        <a
          href="https://github.com/pandegalihsatrioutomo-arch"
          target="_blank"
          class="px-12 py-3 border border-black
                 text-xs tracking-widest
                 hover:bg-black hover:text-white
                 transition duration-300"
        >
          SEE MORE PROJECTS
        </a>
      </div>

    </div>
  </section>

</body>
</html>
