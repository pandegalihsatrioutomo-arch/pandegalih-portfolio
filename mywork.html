<!DOCTYPE html>
<html lang="id">
<head>

  <title>My Work | Pande Galih</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ["Playfair Display", "serif"],
          },
        },
      },
    };
  </script>

<body

  style="background-image: url('asset/BG.png');"
>

  <!-- NAVBAR (TIDAK IKUT SCROLL) -->
  <nav
    class="absolute top-6 left-1/2 -translate-x-1/2 z-30

  >
    <a href="index.html" class="hover:opacity-60">HOME</a>
    <a href="about.html" class="hover:opacity-60">ABOUT</a>
    <a href="mywork.html" class="opacity-100">MYWORK</a>

  <!-- MY WORK SECTION -->

        <p class="text-xs tracking-widest mb-4">

          A curated selection of UI/UX and visual projects

      </div>

      <!-- GALLERY (ABSTRACT / EDITORIAL) -->
      <div class="grid grid-cols-12 gap-y-24 gap-x-6">

        <!-- PROJECT 1 -->
        <div class="col-span-12 sm:col-span-7">
          <img
            src="asset/project/project1.png"

          <p class="mt-4 text-sm tracking-wide">

        <div class="col-span-12 sm:col-span-4 sm:col-start-9 sm:mt-32">
          <img

            class="w-full object-cover transition hover:scale-[1.02]"

          </p>
        </div>

        <!-- PROJECT 3 -->
        <div class="col-span-12 sm:col-span-6 sm:col-start-4 sm:-mt-20">
          <img
            src="asset/project/project3.png"
            alt="Project 3"
            class="w-full object-cover transition hover:scale-[1.02]"
          />
          <p class="mt-4 text-sm tracking-wide">
            Project Three — Visual Concept
          </p>
        </div>

      </div>

      <!-- SEE MORE -->
      <div class="mt-28 flex justify-center">
        <a
          href="https://github.com/pandegalihsatrioutomo-arch"
          target="_blank"
          class="px-10 py-3 border border-black
                 text-xs tracking-widest
                 hover:bg-black hover:text-white
                 transition"
        >
          SEE MORE PROJECTS
        </a>
      </div>

    </div>
  </section>

</html>
