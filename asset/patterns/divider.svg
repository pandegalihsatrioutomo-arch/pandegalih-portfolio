<svg xmlns="http://www.w3.org/2000/svg" width="300" height="40" viewBox="0 0 300 40">
  <g fill="none" stroke="#C9A227" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Center Lotus/Padma Ornament -->
    <g transform="translate(150, 20)">
      <!-- Central flower -->
      <circle cx="0" cy="0" r="3" fill="#C9A227" fill-opacity="0.2"/>
      <circle cx="0" cy="0" r="6"/>
      
      <!-- Lotus petals -->
      <path d="M0 -6 Q3 -10 0 -14 Q-3 -10 0 -6" stroke-width="1.2"/>
      <path d="M0 6 Q3 10 0 14 Q-3 10 0 6" stroke-width="1.2"/>
      <path d="M-6 0 Q-10 3 -14 0 Q-10 -3 -6 0" stroke-width="1.2"/>
      <path d="M6 0 Q10 3 14 0 Q10 -3 6 0" stroke-width="1.2"/>
      
      <!-- Diagonal small petals -->
      <path d="M-4 -4 Q-7 -7 -10 -10" stroke-width="0.8"/>
      <path d="M4 -4 Q7 -7 10 -10" stroke-width="0.8"/>
      <path d="M-4 4 Q-7 7 -10 10" stroke-width="0.8"/>
      <path d="M4 4 Q7 7 10 10" stroke-width="0.8"/>
      
      <!-- Small curl ends -->
      <circle cx="-10" cy="-10" r="1.5" fill="#C9A227" fill-opacity="0.3"/>
      <circle cx="10" cy="-10" r="1.5" fill="#C9A227" fill-opacity="0.3"/>
      <circle cx="-10" cy="10" r="1.5" fill="#C9A227" fill-opacity="0.3"/>
      <circle cx="10" cy="10" r="1.5" fill="#C9A227" fill-opacity="0.3"/>
    </g>
    
    <!-- Left decorative line with curls -->
    <line x1="20" y1="20" x2="120" y2="20" stroke-width="0.8"/>
    
    <!-- Left curl ornament -->
    <g transform="translate(70, 20)">
      <path d="M0 0 Q-5 -5 -10 0 Q-5 5 0 0" stroke-width="0.8"/>
      <circle cx="-10" cy="0" r="1.5" fill="#C9A227" fill-opacity="0.3"/>
    </g>
    
    <!-- Left end ornament -->
    <g transform="translate(20, 20)">
      <circle cx="0" cy="0" r="2" fill="#C9A227" fill-opacity="0.2"/>
      <path d="M-5 0 Q-8 -3 -12 0 Q-8 3 -5 0" stroke-width="0.8"/>
      <circle cx="-12" cy="0" r="1" fill="#C9A227" fill-opacity="0.4"/>
    </g>
    
    <!-- Right decorative line with curls -->
    <line x1="180" y1="20" x2="280" y2="20" stroke-width="0.8"/>
    
    <!-- Right curl ornament -->
    <g transform="translate(230, 20)">
      <path d="M0 0 Q5 -5 10 0 Q5 5 0 0" stroke-width="0.8"/>
      <circle cx="10" cy="0" r="1.5" fill="#C9A227" fill-opacity="0.3"/>
    </g>
    
    <!-- Right end ornament -->
    <g transform="translate(280, 20)">
      <circle cx="0" cy="0" r="2" fill="#C9A227" fill-opacity="0.2"/>
      <path d="M5 0 Q8 -3 12 0 Q8 3 5 0" stroke-width="0.8"/>
      <circle cx="12" cy="0" r="1" fill="#C9A227" fill-opacity="0.4"/>
    </g>
    
  </g>
</svg>
