<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | Pande Galih</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ["Playfair Display", "serif"],
          },
        },
      },
    };
  </script>
</head>

<body
  class="min-h-screen bg-cover bg-center bg-no-repeat font-serif text-neutral-900"
  style="background-image: url('asset/BG.png');"
>

<!-- ================= NAVBAR ================= -->
<header class="absolute top-6 w-full z-40">
  <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">

    <!-- NAME -->
    <span class="text-xs tracking-widest font-semibold">
      PANDE GALIH
    </span>

    <!-- DESKTOP NAV -->
    <nav class="hidden sm:flex gap-12 text-xs tracking-widest font-semibold">
      <a href="index.html" class="opacity-100">HOME</a>
      <a href="about.html" class="hover:opacity-60">ABOUT</a>
      <a href="mywork.html" class="hover:opacity-60">MYWORK</a>
      <a href="contact.html" class="hover:opacity-60">CONTACT</a>
    </nav>

    <!-- BURGER (MOBILE) -->
    <button id="menuBtn" class="sm:hidden flex flex-col gap-1.5">
      <span class="w-6 h-px bg-black"></span>
      <span class="w-6 h-px bg-black"></span>
      <span class="w-6 h-px bg-black"></span>
    </button>

  </div>
</header>

<!-- ================= MOBILE MENU ================= -->
<div
  id="mobileMenu"
  class="fixed inset-0 z-50 bg-white/95
         flex flex-col items-center justify-center
         gap-10 text-sm tracking-widest font-semibold
         opacity-0 pointer-events-none transition duration-300"
>
  <button id="closeBtn" class="absolute top-6 right-6 text-xl">✕</button>

  <a href="index.html">HOME</a>
  <a href="about.html">ABOUT</a>
  <a href="mywork.html">MYWORK</a>
  <a href="contact.html">CONTACT</a>
</div>

<!-- ================= HERO ================= -->
<section class="min-h-screen flex items-center px-6 sm:px-12">
  <div
    class="bg-white/80 max-w-6xl mx-auto w-full
           px-10 sm:px-20 py-16"
  >

    <div class="flex flex-col sm:flex-row items-center justify-between gap-16">

      <!-- TEXT -->
      <div class="max-w-lg text-center sm:text-left">
        <p class="text-xs tracking-widest mb-6">
          PORTFOLIO
        </p>

        <h1 class="text-3xl sm:text-5xl leading-tight mb-6">
          PANDE GALIH<br />
          <span class="border-b-2 border-black">
            SATRIO UTOMO
          </span>
        </h1>

        <p class="text-sm sm:text-lg leading-relaxed mb-10">
          UI/UX Designer and Photographer
          crafting clean, meaningful, and
          visually compelling digital experiences.
        </p>

        <!-- CTA -->
        <div class="flex justify-center sm:justify-start gap-6">
          <a
            href="mywork.html"
            class="px-8 py-3 border border-black
                   text-xs tracking-widest
                   hover:bg-black hover:text-white
                   transition"
          >
            VIEW WORK
          </a>

          <a
            href="contact.html"
            class="px-8 py-3 text-xs tracking-widest
                   hover:opacity-60"
          >
            CONTACT
          </a>
        </div>
      </div>

      <!-- IMAGE -->
      <div class="shrink-0">
        <img
          src="asset/profil1.jpg"
          alt="Pande Galih"
          class="w-48 sm:w-72 object-cover"
        />
      </div>

    </div>
  </div>
</section>

<!-- ================= SCRIPT ================= -->
<script>
  const menuBtn = document.getElementById("menuBtn");
  const closeBtn = document.getElementById("closeBtn");
  const mobileMenu = document.getElementById("mobileMenu");

  menuBtn.addEventListener("click", () => {
    mobileMenu.classList.remove("opacity-0", "pointer-events-none");
  });

  closeBtn.addEventListener("click", () => {
    mobileMenu.classList.add("opacity-0", "pointer-events-none");
  });
</script>

</body>
</html>
